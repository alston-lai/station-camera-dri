{% extends "base.html" %}

{% block title %}修改密码 - Station & Camera DRI Management{% endblock %}

{% block content %}
<div class="pwd-page">
    <div class="pwd-card">
        <div class="pwd-head">
            <div class="pwd-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                </svg>
            </div>
            <h1>修改密码</h1>
            <p>修改成功后，下次登录请使用新密码</p>
        </div>

        <form id="pwdForm">
            <div class="pwd-field">
                <label>工号</label>
                <input type="text" name="employee_id" required
                       value="{{ user.employee_id }}" placeholder="请输入工号" autocomplete="username">
                <div class="pwd-tip">只能修改本人（当前登录账号）的密码</div>
            </div>

            <div class="pwd-field">
                <label>新密码</label>
                <input type="password" name="new_password" required minlength="4"
                       placeholder="请输入新密码（至少 4 位）" autocomplete="new-password">
            </div>

            <div class="pwd-field">
                <label>确认新密码</label>
                <input type="password" name="confirm_password" required
                       placeholder="请再次输入新密码" autocomplete="new-password">
            </div>

            <div class="pwd-actions">
                <button type="submit" class="pwd-btn pwd-btn-primary">确定</button>
                <button type="button" class="pwd-btn pwd-btn-cancel" onclick="cancelChange()">取消</button>
            </div>
        </form>

        <div id="pwdMsg" class="pwd-msg" style="display: none;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<style>
.pwd-page { min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 2rem; }
.pwd-card { background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.08); padding: 2.5rem; width: 100%; max-width: 440px; }
.pwd-head { text-align: center; margin-bottom: 1.5rem; }
.pwd-icon { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; background: linear-gradient(135deg, #0071E3 0%, #5856D6 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,113,227,.3); }
.pwd-icon svg { width: 32px; height: 32px; color: #fff; }
.pwd-head h1 { font-size: 20px; font-weight: 700; color: #1d1d1f; margin: 0 0 4px; }
.pwd-head p { font-size: 13px; color: #86868b; margin: 0; }
.pwd-field { margin-bottom: 1.1rem; }
.pwd-field label { display: block; font-size: 13.5px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
.pwd-field input { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px; border: 1px solid #d2d2d7; border-radius: 10px; color: #1d1d1f; background: #fff; }
.pwd-field input:focus { outline: none; border-color: #0071E3; box-shadow: 0 0 0 3px rgba(0,113,227,.15); }
.pwd-tip { font-size: 12px; color: #a1a1a6; margin-top: 6px; }
.pwd-actions { display: flex; gap: 12px; margin-top: 1.5rem; }
.pwd-btn { flex: 1; padding: 13px; font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: all .2s ease; }
.pwd-btn-primary { background: #0071E3; color: #fff; }
.pwd-btn-primary:hover { background: #0062c4; }
.pwd-btn-cancel { background: #fff; color: #1d1d1f; border-color: #d2d2d7; }
.pwd-btn-cancel:hover { background: #f5f5f7; }
.pwd-msg { margin-top: 1.25rem; padding: 12px 14px; border-radius: 10px; font-size: 13.5px; text-align: center; }
.pwd-msg.ok { background: rgba(52,199,89,.12); color: #1a7f37; }
.pwd-msg.err { background: rgba(255,59,48,.1); color: #FF3B30; }
</style>

<script>
function showPwdMsg(text, ok) {
    var el = document.getElementById('pwdMsg');
    el.textContent = text;
    el.className = 'pwd-msg ' + (ok ? 'ok' : 'err');
    el.style.display = 'block';
}

function cancelChange() {
    // 取消：返回首页（不保存任何修改）
    window.location.href = appUrl('/');
}

document.getElementById('pwdForm').onsubmit = function(e) {
    e.preventDefault();
    var form = e.target;
    var employeeId = form.employee_id.value.trim();
    var newPwd = form.new_password.value;
    var confirmPwd = form.confirm_password.value;

    if (!employeeId) { showPwdMsg('请输入工号', false); return; }
    if (newPwd.length < 4) { showPwdMsg('新密码至少 4 位', false); return; }
    if (newPwd !== confirmPwd) { showPwdMsg('两次输入的新密码不一致', false); return; }

    fetch('/api/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({employee_id: employeeId, new_password: newPwd})
    })
    .then(function(r) { return r.json().then(function(d) { return {status: r.status, data: d}; }); })
    .then(function(res) {
        var data = res.data || {};
        if (data.success) {
            showPwdMsg('✅ 密码修改成功，下次登录请使用新密码', true);
            form.reset();
            form.employee_id.value = '{{ user.employee_id }}';
        } else {
            showPwdMsg(data.message || '修改失败，请重试', false);
        }
    })
    .catch(function() { showPwdMsg('请求失败，请稍后重试', false); });
};
</script>
{% endblock %}
