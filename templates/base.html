<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Station & Camera DRI Management{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(180deg, #FBFBFD 0%, #F5F5F7 100%);
            min-height: 100vh;
        }
        ::selection {
            background: #0071E3;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Apple Style Navigation -->
    <nav class="apple-nav">
        <div class="nav-container">
            <a href="/" id="navLogo" class="nav-logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span>Station & Camera DRI</span>
            </a>
            
            <div class="nav-links">
                <a href="/department" class="nav-link">部门信息</a>
                <a href="/action-items" class="nav-link">Action Items</a>
                <a href="/info-list" class="nav-link">信息列表</a>
                <a href="/collector" class="nav-link">数据收集</a>
                <a href="/history" class="nav-link">历史记录</a>
            </div>
            
            <div class="nav-auth">
                <span id="userInfo" class="nav-user hidden">
                    <span class="user-avatar" id="userAvatar"></span>
                    <span id="userName"></span>
                </span>
                <button id="logoutBtn" onclick="logout()" class="nav-logout hidden">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    退出
                </button>
                <a href="/login" id="loginLink" class="nav-login">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    登录
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>Station & Camera DRI Management System</p>
            <p class="footer-copy">© 2024 Luxshare Precision. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script>
        function checkLogin() {
            fetch('/api/current-user')
                .then(r => r.json())
                .then(data => {
                    if (data.logged_in) {
                        document.getElementById('userName').textContent = data.user.name;
                        document.getElementById('userAvatar').textContent = data.user.name.charAt(0);
                        document.getElementById('userInfo').classList.remove('hidden');
                        document.getElementById('userInfo').classList.add('flex');
                        document.getElementById('logoutBtn').classList.remove('hidden');
                        document.getElementById('logoutBtn').classList.add('flex');
                        document.getElementById('loginLink').classList.add('hidden');
                        // 已登录：Logo 链接指向首页
                        document.getElementById('navLogo').href = '/';
                    } else {
                        document.getElementById('loginLink').classList.remove('hidden');
                        document.getElementById('loginLink').classList.add('flex');
                        // 未登录：Logo 链接指向登录页
                        document.getElementById('navLogo').href = '/login';
                    }
                });
        }
        
        function logout() {
            fetch('/api/logout', {method: 'POST'})
                .then(() => window.location.href = '/login');
        }
        
        checkLogin();
    </script>
</body>
</html>
