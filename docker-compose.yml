services:
  dri:
    build: .
    image: station-camera-dri:latest
    container_name: station-camera-dri
    restart: unless-stopped
    ports:
      # 宿主机 8080 → 容器内 8000（容器内端口与宿主互不冲突，改这里即可换访问端口）
      - "8080:8000"
    environment:
      # 生产保持为空；如需调试模板热重载可设 true
      FLASK_DEBUG: ""
      # ⚠️ 会话 Cookie 是否仅经 HTTPS 传输。
      #   直接以 http://IP:8080 访问时必须为 "false"，否则登录后 Cookie 不会被带上，表现为“登录不了/打不开”。
      #   配好 HTTPS 反向代理后再改成 "true"。
      SESSION_COOKIE_SECURE: "false"
      # 用户管理入口密码（务必修改）
      ADMIN_PASSWORD: "DLJ360781dlj"
      # 加密备份口令（用于 scripts/backup.py，务必修改并妥善保管）
      BACKUP_PASSWORD: "change-me-please"
      # 可选：固定会话签名密钥（不设则在 data/.secret_key 自动生成并持久化）
      # SECRET_KEY: "请填入一段随机字符串"
      # 可选：当数据库中没有用户时，用该工号自动创建一个初始管理员，避免全新部署被锁在外面
      # ADMIN_EMPLOYEE_ID: "12214253"
      # ADMIN_NAME: "Admin"
    volumes:
      # 把宿主机 data 目录挂进去，数据库(data/app.db)持久化并随容器重建保留
      - ./data:/app/data
    working_dir: /app/scripts
    # 关键：必须用 gthread（多线程）+ 合理的超时/keep-alive。
    # 若用默认 sync worker，遇到“连上但不发完整请求”的连接（浏览器预连接、端口探测、
    # 健康检查等）会阻塞并触发 WORKER TIMEOUT，worker 被反复杀掉 → 网站打不开。
    command: >
      gunicorn -b 0.0.0.0:8000
      -w 1 -k gthread --threads 8
      --timeout 120 --graceful-timeout 30
      --keep-alive 5 --max-requests 2000
      app:app
